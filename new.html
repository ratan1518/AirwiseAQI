<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airwise AQI</title>
    <link rel="stylesheet" href="stylenew.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        * {
            font-family: 'Times New Roman', Times, serif;
        }

        body {
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: calc(100vh - 70px - 50px);
            margin-top: 70px;
            z-index: 0;
        }

        header {
            background-color: #2d3e50;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .search-bar-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        /* Increased the width of the input and the button */
        .search-bar-container input {
            padding: 15px;
            width: 500px;
            border: none;
            border-radius: 5px 0 0 5px;
            outline: none;
            font-size: 16px;
        }

        .search-bar-container button {
            padding: 15px 30px;
            border: none;
            background-color: #27ad74;
            color: rgb(255, 255, 255);
            font-weight: bold;
            cursor: pointer;
            border-radius: 0 5px 5px 0;
            transition: background-color 0.3s ease;
            font-size: 16px;
        }

        .search-bar-container button:hover {
            background-color: #239a68;
        }

        #loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 5px;
        }

        #detailed-info-btn {
            padding: 15px 20px;
            /* Increased padding for a bigger button */
            font-size: 21px;
            /* Increased font size for better visibility */
            background-color: #27ad74;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1001;
            transition: background-color 0.3s ease;
        }

        #detailed-info-btn:hover {
            background-color: #239a68;
            /* Darker shade on hover */
        }

        .dropdown {
            position: relative;
            display: inline-block;
            right: 30px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: hwb(209 54% 4%);
            min-width: 200px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1001;
            right: 0;
            margin-top: 5px;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font: bolder;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropbtn {
            background-color: rgb(39, 139, 74);
            color: rgb(255, 255, 255);
            padding: 16px;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }

        .logo-container {
            display: flex;
            align-items: center;
            width: 100px;
            height: auto;
        }

        .logo-container img.logo {
            width: 100px;
            height: 40px;
            margin-right: 100px;
        }

        .logo-container h1 {
            color: #007BFF;
            font-size: 1.5em;
            margin: 0;
        }
    </style>
</head>

<body>

    <header>
        <div class="header-container">
            <div class="logo-container">
                <a href="new.html">
                    <img src="logo2.png" class="logo" alt="Airwise Logo">
                </a>
            </div>
        </div>
        <div class="search-bar-container">
            <input type="text" id="location-input" placeholder="Enter a location" onfocus="removePlaceholder()"
                onblur="restorePlaceholder()">
            <button id="search-btn">Search</button>
        </div>

        <script>
            function removePlaceholder() {
                document.getElementById('location-input').placeholder = '';
            }

            function restorePlaceholder() {
                const locationInput = document.getElementById('location-input');
                if (!locationInput.value) {
                    locationInput.placeholder = 'Enter a location';
                }
            }
        </script>

        <div class="dropdown">
            <button class="dropbtn">MENU</button>
            <div class="dropdown-content">
                <a href="welcome.html">HOME</a>
                <a href="aboutus.html">ABOUT US</a>
                <a href="contactus.html">CONTACT US</a>
                <a href="news.html">NEWS</a>
                <a href="info.html">AQI INFO</a>
            </div>
        </div>
    </header>

    <div id="loading">Loading...</div>
    <div id="map"></div>

    <div style="text-align: center; margin: 10px;">
        <button id="detailed-info-btn">View Detailed Info</button>
    </div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Initialize the map
        var map = L.map('map').setView([19.0760, 72.8777], 7);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        async function fetchAQI(lat, lon) {
            const apiKey = 'd8a56e5af8e1002cfc8a1b8704f5af9e66e51492'; // Your WAQI API token
            // const apiKey = '71422dc0-0411-45ab-8cf5-d6d523c9abb5'; // Your IQAir API key here
            const url = `https://api.waqi.info/feed/geo:${lat};${lon}/?token=${apiKey}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                if (data.status === 'ok') {
                    return data.data;
                } else {
                    throw new Error('Location not found');
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                alert(error.message);
            }
        }

        async function fetchCoordinates(location) {
            const geocodingApiKey = 'b44894040ab743c49d88b931f9b54db6'; // Replace with your actual OpenCage API key
            const url = `https://api.opencagedata.com/geocode/v1/json?q=${encodeURIComponent(location)}&key=${geocodingApiKey}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                if (data.results.length > 0) {
                    const lat = data.results[0].geometry.lat;
                    const lon = data.results[0].geometry.lng;
                    return { lat, lon };
                } else {
                    throw new Error('Coordinates not found');
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                alert(error.message);
            }
        }

        function getColor(aqi) {
            if (aqi <= 50) return 'black';
            if (aqi <= 100) return 'black';
            if (aqi <= 150) return 'black';
            if (aqi <= 200) return 'black';
            if (aqi <= 300) return 'black';
            return 'maroon';
        }

        document.getElementById('search-btn').addEventListener('click', async () => {
            const location = document.getElementById('location-input').value.trim();
            const loadingIndicator = document.getElementById('loading');

            if (location) {
                loadingIndicator.style.display = 'block';

                const coords = await fetchCoordinates(location);
                const cityData = await fetchAQI(coords.lat, coords.lon);

                if (coords && cityData) {
                    map.setView([coords.lat, coords.lon], 10);
                    const markerColor = getColor(cityData.aqi);
                    L.marker([coords.lat, coords.lon]).addTo(map)
                        .bindPopup(`<div style="font-size: 25px; font-weight: bold;">
                                        Location: <span style="color:${markerColor};">${location}</span><br>
                                        AQI: <span style="color:${markerColor};">${cityData.aqi}</span>
                                    </div>`)
                        .openPopup();
                }

                loadingIndicator.style.display = 'none';
            } else {
                alert('Please enter a location');
            }
        });

        document.getElementById('detailed-info-btn').addEventListener('click', () => {
            window.location.href = 'detailed-info.html'; // Replace with your actual detailed info page URL
        });

        // Dropdown functionality
        document.addEventListener('DOMContentLoaded', function () {
            const dropdownBtn = document.querySelector('.dropbtn');
            const dropdownContent = document.querySelector('.dropdown-content');

            dropdownBtn.addEventListener('click', function () {
                dropdownContent.style.display = dropdownContent.style.display === 'block' ? 'none' : 'block';
            });

            // Close the dropdown if clicked outside of it
            window.addEventListener('click', function (event) {
                if (!event.target.matches('.dropbtn')) {
                    if (dropdownContent.style.display === 'block') {
                        dropdownContent.style.display = 'none';
                    }
                }
            });
        });
    </script>

</body>

</html>
